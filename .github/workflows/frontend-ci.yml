name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - wip/recuperacao-local-pre-auditoria

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build

  e2e-real-browser:
    name: E2E real browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      E2E_FRONTEND_URL: ${{ secrets.SAGE_E2E_FRONTEND_URL }}
      E2E_API_URL: ${{ secrets.SAGE_E2E_API_URL }}
      E2E_ADMIN_TOKEN: ${{ secrets.SAGE_E2E_ADMIN_TOKEN }}
      E2E_SECRETARIA_TOKEN: ${{ secrets.SAGE_E2E_SECRETARIA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Nexus-Evolution-Tech/SAGE-API
          ref: 6a69f438cbd5b1cc17ec6083edb87c4d08a08e90
          path: .e2e-dependency/SAGE-API
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Windows'
        run: npm.cmd ci
      - if: runner.os != 'Windows'
        run: npm ci
      - if: runner.os == 'Windows'
        run: npx.cmd playwright install chromium
      - if: runner.os != 'Windows'
        run: npx playwright install chromium
      - name: Verificar commits da dupla E2E
        run: |
          node -e "const { execFileSync } = require('child_process'); execFileSync('git', ['merge-base', '--is-ancestor', 'bf33451', 'HEAD'], { stdio: 'inherit' }); const api = execFileSync('git', ['-C', '.e2e-dependency/SAGE-API', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (api !== '6a69f438cbd5b1cc17ec6083edb87c4d08a08e90') process.exit(1);"
      - if: runner.os == 'Windows'
        run: npm.cmd run test:e2e
      - if: runner.os != 'Windows'
        run: npm run test:e2e
      - name: Publicar artefatos somente em falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
